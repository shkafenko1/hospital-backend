              schema: { $ref: '#/components/schemas/Ward' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/wards/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [Wards]
      summary: Get ward by ID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ward' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Wards]
      summary: Update ward (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Ward' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ward' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Wards]
      summary: Delete ward (admin only)
      responses:
        '204': { description: No Content }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/medicines:
    get:
      tags: [Medicines]
      summary: List all medicines
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
