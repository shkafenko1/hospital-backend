components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

  responses:
    BadRequest:
      description: Invalid request body
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, example: admin }
        password: { type: string, example: password }
    LoginResponse:
      type: object
      properties:
        token: { type: string }
        role:  { type: string, enum: [admin, user] }

    Patient:
      type: object
      properties:
        id:          { type: integer, format: int64, readOnly: true }
        passport:    { type: string, maxLength: 9, example: "AB1234567" }
        first_name:  { type: string, maxLength: 20 }
        middle_name: { type: string, maxLength: 20 }
        last_name:   { type: string, maxLength: 20 }
        phone:       { type: string, maxLength: 13, example: "+1234567" }
        birth_date:  { type: string, format: date-time }
        sex:         { type: string, example: "M" }
        address:     { type: string, maxLength: 50 }

    Doctor:
      type: object
      properties:
        id:             { type: integer, format: int64, readOnly: true }
        first_name:     { type: string }
        middle_name:    { type: string }
        last_name:      { type: string }
        specialization: { type: string }
        office:         { type: integer, format: int64 }
        license_number: { type: integer, format: int64 }
        phone:          { type: string }
        experience:     { type: integer, format: int64 }

    Ward:
      type: object
      properties:
        id:       { type: integer, format: int64, readOnly: true }
        number:   { type: integer, format: int64 }
        floor:    { type: integer, format: int64 }
        capacity: { type: integer, format: int64 }
        price:    { type: integer, format: int64 }
        comfort:  { type: string }
        busy:     { type: boolean }

    Medicine:
      type: object
      properties:
        id:                { type: integer, format: int64, readOnly: true }
        article:           { type: integer, format: int64 }
        name:              { type: string }
        active_substance:  { type: string }
        form:              { type: string }
        contraindications: { type: string }
        prescription:      { type: boolean }

    Hospitalization:
      type: object
      properties:
        id:                  { type: integer, format: int64, readOnly: true }
        type:                { type: string }
        status:              { type: string }
        beginning_date:      { type: string, format: date-time }
        primary_diagnosis:   { type: string }
        discharge_date:      { type: string, format: date-time, nullable: true }
        discharge_diagnosis: { type: string, nullable: true }
        patient_id:          { type: integer, format: int64 }
        doctor_id:           { type: integer, format: int64 }
        ward_id:             { type: integer, format: int64 }

    Visit:
      type: object
      properties:
        id:         { type: integer, format: int64, readOnly: true }
        date_time:  { type: string, format: date-time }
        symptoms:   { type: string }
        diagnosis:  { type: string }
        advise:     { type: string }
        price:      { type: number, format: double }
        patient_id: { type: integer, format: int64 }
        doctor_id:  { type: integer, format: int64 }
