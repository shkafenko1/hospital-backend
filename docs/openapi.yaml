openapi: 3.0.3
info:
  title: Hospital Backend API
  description: |
    REST API for the hospital management system.

    ## Authentication
    All `/api/*` endpoints (except `/api/auth/login`) require a JWT in the
    `Authorization: Bearer <token>` header. Tokens are obtained via the login
    endpoint and embed the user's role (`admin` or `user`).

    ## Roles
    - **admin**: full access (create/update/delete on doctors, wards, medicines).
    - **user**: read-only on doctors, wards, medicines; full CRUD on patients,
      visits and hospitalizations.

    Default seeded accounts (password: `password`):
    - `admin` / `password`
    - `user`  / `password`
  version: "1.0.0"
servers:
  - url: http://localhost:8000
    description: Local development server
tags:
  - name: Auth
  - name: Patients
  - name: Doctors
  - name: Wards
  - name: Medicines
  - name: Hospitalizations
  - name: Visits

security:
  - bearerAuth: []

paths:
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Authenticate and receive a JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/patients:
    get:
      tags: [Patients]
      summary: List all patients
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Patient' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Patients]
      summary: Create patient
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Patient' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Patient' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/patients/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [Patients]
      summary: Get patient by ID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Patient' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Patients]
      summary: Update patient
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Patient' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Patient' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Patients]
      summary: Delete patient
      responses:
        '204': { description: No Content }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/doctors:
    get:
      tags: [Doctors]
      summary: List all doctors
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Doctor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Doctors]
      summary: Create doctor (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Doctor' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Doctor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/doctors/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [Doctors]
      summary: Get doctor by ID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Doctor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Doctors]
      summary: Update doctor (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Doctor' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Doctor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Doctors]
      summary: Delete doctor (admin only)
      responses:
        '204': { description: No Content }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/wards:
    get:
      tags: [Wards]
      summary: List all wards
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
